{% extends 'base.html' %}
{% block content %}
<div class="container-fluid px-4 mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <div>
            <h2 class="fw-bold m-0 text-dark"><i class="fas fa-university text-dark me-2"></i> Gestão de Patrimônio</h2>
            <p class="text-muted small mb-0 mt-1">Inventário de Bens Ativos e Em Movimentação</p>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm bg-primary text-white p-3">
                <div class="d-flex align-items-center">
                    <i class="fas fa-tag fa-2x me-3 opacity-50"></i>
                    <div>
                        <small class="d-block opacity-75">Bens Ativos</small>
                        <h3 class="mb-0 fw-bold">{{ total_bens|default:"0" }}</h3>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <form class="card border-0 shadow-sm p-2 flex-row align-items-center">
                <i class="fas fa-search ms-3 text-muted"></i>
                <input type="text" class="form-control border-0 shadow-none" placeholder="Buscar por Nº do Ativo, Descrição ou Termo...">
                <button class="btn btn-warning fw-bold px-4 me-1">BUSCAR</button>
            </form>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
            <h6 class="mb-0 fw-bold">ÚLTIMOS BENS INCORPORADOS</h6>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 small">
                <thead class="table-light text-center">
                    <tr>
                        <th class="text-center">Ativo</th>
                        <th class="text-center">Descrição</th>
                        <th class="text-center">Projeto</th>
                        <th class="text-center">Valor</th>
                        <th class="text-center">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="5" class="text-center py-4 text-muted">Realize uma incorporação para listar os bens aqui.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
