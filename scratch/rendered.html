

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ARGUS | Polo de Inovação IFAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-top: 5px solid #28a745; /* Verde Institucional IFAM */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .brand-logo {
            font-weight: 800;
            font-size: 2rem;
            color: #343a40;
            letter-spacing: -1px;
        }
        .brand-subtitle {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            
            <div class="card login-card p-4">
                <div class="text-center mb-4">
                    <h1 class="brand-logo">ARGUS</h1>
                    <div class="brand-subtitle">Polo de Inovação IFAM</div>
                </div>

                

                <form method="POST" action="/login/">
                    <input type="hidden" name="csrfmiddlewaretoken" value="0Pk18iJWfgWQC2LXsIdVBCMljHSw190BWuaenFRV9v6aiMu6alJubgXuesTLRVWt">
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label text-muted fw-bold" style="font-size: 0.85rem;">USUÁRIO / SIAPE</label>
                        <input type="text" name="username" id="id_username" class="form-control form-control-lg" required autofocus autocomplete="username">
                    </div>
                    
                    <div class="mb-4">
                        <label for="id_password" class="form-label text-muted fw-bold" style="font-size: 0.85rem;">SENHA</label>
                        <input type="password" name="password" id="id_password" class="form-control form-control-lg" required autocomplete="current-password">
                    </div>
                    
                    <input type="hidden" name="next" value="/cadastros/projeto/2/editar/">
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg fw-bold">ACESSAR SISTEMA</button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <small class="text-muted">Acesso restrito a servidores e colaboradores autorizados.</small>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
