{% extends 'base.html' %}
{% block title %}Andares{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0 text-institucional"><i class="fas fa-list me-2"></i> Lista de Andares</h2>
    <div>
        <a href="{% url 'home_manutencao_predial:dashboard' %}" class="btn btn-outline-secondary me-2">Voltar</a>
        <a href="{% url 'home_manutencao_predial:andar_create' %}" class="btn btn-success fw-bold">Novo Andar</a>
    </div>
</div>
<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-3">ID / Nome</th>
                        <th class="text-end pe-3">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for obj in objects %}
                    <tr>
                        <td class="ps-3">{{ obj }}</td>
                        <td class="text-end pe-3">
                            <a href="{% url 'home_manutencao_predial:andar_update' obj.pk %}" class="btn btn-sm btn-primary"><i class="fas fa-edit"></i></a>
                            <a href="{% url 'home_manutencao_predial:andar_delete' obj.pk %}" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="2" class="text-center py-4 text-muted">Nenhum registro encontrado.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
