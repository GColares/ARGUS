{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-danger shadow-sm rounded-3">
                <div class="card-header bg-danger text-white py-3">
                    <h5 class="mb-0 fw-bold"><i class="fas fa-exclamation-triangle me-2"></i> Confirmar Exclusão</h5>
                </div>
                <div class="card-body p-4 text-center">
                    <p class="fs-5 mb-4">Tem certeza que deseja excluir a Conta Bancária <strong>{{ conta.conta }}-{{ conta.dv }}</strong> ({{ conta.banco }}) vinculada ao projeto <strong>{{ projeto.nome }}</strong>?</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'cadastros:gerenciar_contas' projeto.id %}" class="btn btn-light btn-lg border fw-bold px-4">Cancelar</a>
                            <button type="submit" class="btn btn-danger btn-lg fw-bold px-4 shadow-sm">
                                <i class="fas fa-trash-alt me-2"></i> Sim, Excluir Conta
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
