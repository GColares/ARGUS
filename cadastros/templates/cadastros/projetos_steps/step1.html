<!-- 1. Dados Cadastrais -->
<div class="wizard-step active flex-grow-1" id="step1">
    <h4 class="fw-bold text-secondary border-bottom pb-2 mb-4">1. Dados Cadastrais</h4>
    <div class="row g-4">
        <div class="col-md-12">
            <label class="form-label fw-bold text-muted small text-uppercase">1.1 Empresa Parceira / Agência de Fomento (Concedente) <span class='text-danger'>*</span></label>
            {{ form_projeto.concedente }}
        </div>
        <div class="col-md-12 mt-3">
            <label class="form-label fw-bold text-muted small text-uppercase">1.2 Instituição Científica e Tecnológica - ICT (Convenente) <span class='text-danger'>*</span></label>
            {{ form_projeto.convenente }}
        </div>
        <div class="col-md-12 mt-3">
            <label class="form-label fw-bold text-muted small text-uppercase">1.3 Fundação de Apoio (Interveniente) <span class='text-danger'>*</span></label>
            {{ form_projeto.interveniente }}
        </div>
        <div class="col-md-12 mt-4 pt-3 border-top bg-light p-3 rounded">
            <label class="form-label fw-bold text-primary small text-uppercase"><i class="fas fa-sitemap me-2"></i>Programa</label>
            <p class="text-muted small mb-2">Selecione-o abaixo:</p>
            {{ form_projeto.programa }}
        </div>
    </div>
    <div class="d-flex justify-content-end mt-auto pt-3 pb-3 mb-2 border-top sticky-actions-bar">
        <button type="button" class="btn btn-info text-white  px-4 fw-bold btn-next" data-next="step2">Próximo <i class="fas fa-arrow-right ms-2"></i></button>
    </div>
</div>
