<!-- 2. Descrição Básica -->
<div class="wizard-step flex-grow-1" id="step2">
    <h4 class="fw-bold text-secondary border-bottom pb-2 mb-4">2. Descrição Básica</h4>
    <div class="row g-4">
        <div class="col-md-12">
            <label class="form-label fw-bold text-muted small text-uppercase">2.1 Título Completo do Projeto <span class='text-danger'>*</span></label>
            {{ form_projeto.nome }}
        </div>
        <div class="col-md-12 mt-4 pt-3 border-top bg-light p-3 rounded">
            <label class="form-label fw-bold text-primary small text-uppercase"><i class="fas fa-link me-2"></i>Vincular a Termo Específico Existente (Opcional)</label>
            <p class="text-muted small mb-2">Se a Gestão de Contratos já iniciou um Termo no SIPAC específico para este projeto, selecione-o abaixo:</p>
            <select name="termo_existente" id="termo_existente" class="form-select">
                <option value="">Nenhum / Continuar em Prospecção Solta</option>
                {% if projeto and projeto.termos_parceria.first %}
                {% with tp=projeto.termos_parceria.first %}
                <option value="{{ tp.id }}" selected>Termo {{ tp.numero }} - {{ tp.objeto }} (Vinculado Atualmente)</option>
                {% endwith %}
                {% endif %}
                <!-- Opções adicionais preenchidas via AJAX -->
            </select>
        </div>
        <div class="col-md-6 mt-4">
            <label class="form-label fw-bold text-muted small text-uppercase">2.2 Identificação / Sigla <span class='text-danger'>*</span></label>
            {{ form_projeto.projeto }}
        </div>
        <div class="col-md-6 mt-4">
            <label class="form-label fw-bold text-muted small text-uppercase">2.3 Coordenador do Projeto <span class='text-danger'>*</span></label>
            {{ form_projeto.coordenador }}
        </div>
    </div>
    <div class="d-flex justify-content-between mt-auto pt-3 pb-3 mb-2 border-top sticky-actions-bar">
        <button type="button" class="btn btn-outline-secondary px-4 fw-bold btn-prev" data-prev="step1"><i class="fas fa-arrow-left ms-2"></i> Voltar</button>
        <button type="button" class="btn btn-info text-white px-4 fw-bold btn-next" data-next="step3">Próximo <i class="fas fa-arrow-right ms-2"></i></button>
    </div>
</div>
