{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card border-danger shadow">
        <div class="card-header bg-danger text-white fw-bold">Confirmar Exclusão</div>
        <div class="card-body text-center p-5">
            <h4 class="text-danger mb-4">Tem certeza que deseja excluir o Termo de Cooperação "{{ object.numero }}"?</h4>
            <form method="post">
                {% csrf_token %}
                <a href="javascript:history.back()" class="btn btn-secondary me-2">Cancelar</a>
                <button type="submit" class="btn btn-danger">Sim, Excluir</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
