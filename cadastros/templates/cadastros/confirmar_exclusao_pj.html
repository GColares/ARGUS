{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-4 mt-4">
    <!-- Breadcrumb e Voltar -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-1">
            <li class="breadcrumb-item"><a href="{% url 'cadastros:home_cadastros' %}" class="text-decoration-none">Cadastros</a></li>
            <li class="breadcrumb-item"><a href="{% url 'cadastros:listar_pessoas_juridicas' %}" class="text-decoration-none">Pessoas Jurídicas</a></li>
            <li class="breadcrumb-item active" aria-current="page">Excluir</li>
        </ol>
    </nav>
    <a href="javascript:history.back()" class="text-muted small fw-bold mb-3 d-inline-block text-decoration-none">
        <i class="fas fa-arrow-left me-1"></i> Voltar
    </a>

    <!-- Container Central -->
    <div class="row justify-content-center mt-3">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-3">
                
                <div class="card-body p-5 text-center bg-light">
                    
                    <div class="mb-4">
                        <i class="fas fa-exclamation-triangle fa-4x text-danger opacity-75"></i>
                    </div>

                    <h4 class="fw-bold text-dark mb-3">Confirmar Exclusão</h4>
                    
                    <p class="text-muted mb-4 fs-5">
                        Tem certeza que deseja excluir o cadastro da entidade abaixo?
                    </p>

                    <div class="bg-white border rounded p-3 mb-5 text-start shadow-sm mx-auto" style="max-width: 400px;">
                        <div class="text-muted small fw-bold text-uppercase mb-1">Razão Social / Instituição</div>
                        <div class="fw-bold fs-5 text-dark">{{ pj.nome }}</div>
                        
                        <div class="text-muted small fw-bold text-uppercase mt-3 mb-1">CNPJ</div>
                        <div class="text-dark">{{ pj.cnpj }}</div>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'cadastros:listar_pessoas_juridicas' %}" class="btn btn-outline-secondary fw-bold px-4 py-2">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-danger fw-bold px-4 py-2">
                                <i class="fas fa-trash-alt me-2"></i> Sim, Excluir Definitivamente
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
