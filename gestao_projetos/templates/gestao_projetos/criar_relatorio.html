{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
        <h4><i class="fas fa-file-medical text-primary me-2"></i>Novo Relatório de Atividades</h4>
        <a href="{% url 'gestao_projetos:listar_relatorios' %}" class="btn btn-outline-secondary btn-sm">Voltar</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{% url 'gestao_projetos:criar_relatorio' %}">
                {% csrf_token %}
                
                <div class="row g-3">
                    <div class="col-md-9">
                        <label class="form-label fw-bold">Termo de Bolsa (Bolsista)</label>
                        <select name="termo_id" class="form-select" required>
                            <option value="">Selecione o bolsista/termo...</option>
                            {% for termo in termos %}
                                <option value="{{ termo.id }}">{{ termo.bolsista.nome }} - Termo {{ termo.numero_termo }} ({{ termo.cota_pt.projeto.nome }})</option>
                            {% endfor %}
                        </select>
                        <small class="text-muted">A parcela será calculada automaticamente com base no histórico do termo.</small>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold">Ref. Macro Entrega</label>
                        <input type="text" name="macroentrega" class="form-control" placeholder="Ex: M1, M2" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Período Início</label>
                        <input type="date" name="periodo_inicio" class="form-control" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Período Fim</label>
                        <input type="date" name="periodo_fim" class="form-control" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Carga Horária do Período</label>
                        <div class="input-group">
                            <input type="number" name="carga_horaria_periodo" class="form-control" min="1" required>
                            <span class="input-group-text">horas</span>
                        </div>
                    </div>
                </div>

                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i> Criar Rascunho e Detalhar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
