{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0"><i class="bi bi-file-earmark-word me-2"></i>PoC: Extração de Matriz (DOCX)</h5>
        </div>
        <div class="card-body p-4 bg-light">
            
            {% if erro %}
                <div class="alert alert-danger shadow-sm"><i class="bi bi-x-circle me-2"></i>{{ erro }}</div>
            {% endif %}
            
            {% if sucesso %}
                <div class="alert alert-success shadow-sm"><i class="bi bi-check-circle me-2"></i>{{ sucesso }}</div>
            {% endif %}
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="arquivo_docx" class="form-label fw-bold">Selecione o Plano de Trabalho (.docx)</label>
                    <input class="form-control" type="file" id="arquivo_docx" name="arquivo_docx" accept=".docx" required>
                    <div class="form-text">O arquivo não será salvo no servidor. A leitura ocorrerá inteiramente em memória.</div>
                </div>
                <button type="submit" class="btn btn-primary px-4 shadow-sm">
                    <i class="bi bi-cpu-fill me-2"></i>Processar Extração
                </button>
            </form>
            
        </div>
    </div>
</div>
{% endblock %}
