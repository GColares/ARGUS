{% extends 'base.html' %}
{% block title %}Excluir Andar{% endblock %}
{% block content %}
<div class="container-fluid px-4 py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="mb-3">
                <a href="{% url 'central_servicos:andar_list' %}" class="text-decoration-none text-muted small fw-bold mb-2 d-inline-block">
                    <i class="fas fa-arrow-left me-1"></i> Voltar para Lista de Andares
                </a>
            </div>
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-5 text-center">
                    <div class="mb-4">
                        <i class="fas fa-exclamation-triangle fa-4x text-warning"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-3">Confirmar Exclusão</h3>
                    <p class="lead text-muted mb-4">Tem certeza que deseja excluir o registro <strong>"{{ object.nome }}"</strong>?</p>
                    <div class="alert alert-danger border-0" role="alert">
                        <i class="fas fa-info-circle me-2"></i> Esta ação não pode ser desfeita.
                    </div>
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'central_servicos:andar_list' %}" class="btn btn-light btn-lg px-4">Cancelar</a>
                            <button type="submit" class="btn btn-danger btn-lg px-4 shadow-sm">
                                <i class="fas fa-trash-alt me-2"></i> Sim, Excluir
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
