{% extends 'base.html' %}
{% block content %}
<style>
    .argus-home {
        background:
            radial-gradient(circle at 10% 20%, rgba(var(--bs-primary-rgb), 0.04) 0%, transparent 40%),
            radial-gradient(circle at 90% 80%, rgba(var(--bs-success-rgb), 0.04) 0%, transparent 40%),
            #f8f9fa;
        min-height: calc(100vh - 70px);
    }

    .modulo-card {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(var(--bs-primary-rgb), 0.12);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 1rem;
        box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.04);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .modulo-card:hover {
        transform: translateY(-4px);
        border-color: rgba(var(--bs-primary-rgb), 0.35);
        box-shadow: 0 0.75rem 2rem rgba(var(--bs-primary-rgb), 0.12);
    }

    .modulo-icon {
        width: 3.5rem;
        height: 3.5rem;
        color: var(--bs-primary);
        background: rgba(var(--bs-primary-rgb), 0.08);
        border-radius: 0.85rem;
        transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .modulo-card:hover .modulo-icon {
        transform: scale(1.08);
        background: rgba(var(--bs-primary-rgb), 0.15);
    }

    .modulo-title {
        font-size: 1.05rem;
        font-weight: 700;
        line-height: 1.3;
        min-height: 2.6rem;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .modulo-description {
        font-size: 0.825rem;
        line-height: 1.4;
        min-height: 2.8rem;
        color: var(--bs-secondary);
    }
</style>

<div class="argus-home py-4">
    <div class="container-fluid px-4 px-xl-5">

        <!-- Seção dos Módulos em Grid Responsivo Otimizado (4 cards por linha em telas grandes) -->
        <section aria-label="Módulos do Sistema">
            <div class="row g-3 g-xl-4 justify-content-center">
                {% for modulo in modulos %}
                <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
                    <article class="modulo-card h-100">
                        <div class="card-body p-3 p-xl-4 text-center d-flex flex-column h-100">
                            <!-- Ícone Temático Compacto -->
                            <div class="modulo-icon d-inline-flex align-items-center justify-content-center mx-auto mb-3">
                                <i class="fas {{ modulo.icone }} fa-lg"></i>
                            </div>

                            <!-- Título do Módulo -->
                            <h2 class="modulo-title text-dark mb-2">
                                {{ modulo.nome }}
                            </h2>

                            <!-- Descrição Sintética -->
                            <p class="modulo-description mb-3">
                                {{ modulo.descricao|default:"Acesse este módulo para consultar e gerenciar os recursos do ARGUS." }}
                            </p>

                            <!-- Botão de Acesso Direto -->
                            <a href="{% url modulo.url %}" class="btn btn-outline-primary btn-sm rounded-pill fw-semibold mt-auto py-2 shadow-sm" aria-label="Acessar módulo {{ modulo.nome }}">
                                Acessar módulo <i class="fas fa-arrow-right ms-1 small"></i>
                            </a>
                        </div>
                    </article>
                </div>
                {% endfor %}
            </div>
        </section>

    </div>
</div>
{% endblock %}
