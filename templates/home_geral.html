{% extends 'base.html' %}
{% block content %}
<style>
    :root {
        /* Identidade Primária ARGUS & INOVA (Padrão Prototipo Tela 1) */
        --argus-azul: #0D3B66;
        --argus-azul-rgb: 13, 59, 102;
        --argus-teal: #1AA3A8;
        --argus-teal-rgb: 26, 163, 168;
        --inova-verde: #7EC247;
        --inova-verde-rgb: 126, 194, 71;
        --inova-vermelho: #B72D25;
        --inova-vermelho-rgb: 183, 45, 37;
        --inova-ouro: #D48806;
        --inova-ouro-rgb: 212, 136, 6;
        --inova-grafite: #1A1A1A;
        --inova-grafite-rgb: 26, 26, 26;
        --inova-roxo: #6f42c1;
        --inova-roxo-rgb: 111, 66, 193;
    }

    .argus-home {
        background:
            radial-gradient(circle at 8% 12%, rgba(var(--argus-azul-rgb), 0.06) 0%, transparent 45%),
            radial-gradient(circle at 92% 88%, rgba(var(--inova-verde-rgb), 0.08) 0%, transparent 45%),
            radial-gradient(circle at 50% 50%, rgba(var(--argus-teal-rgb), 0.03) 0%, transparent 60%),
            #f8fafc;
        min-height: calc(100vh - 70px);
    }

    /* Mapeamento Cromático dos Módulos */
    .theme-primary {
        --card-accent: var(--argus-azul);
        --card-accent-rgb: var(--argus-azul-rgb);
    }
    .theme-success {
        --card-accent: var(--inova-verde);
        --card-accent-rgb: var(--inova-verde-rgb);
    }
    .theme-danger {
        --card-accent: var(--inova-vermelho);
        --card-accent-rgb: var(--inova-vermelho-rgb);
    }
    .theme-warning {
        --card-accent: var(--inova-ouro);
        --card-accent-rgb: var(--inova-ouro-rgb);
    }
    .theme-info {
        --card-accent: var(--argus-teal);
        --card-accent-rgb: var(--argus-teal-rgb);
    }
    .theme-dark {
        --card-accent: var(--inova-grafite);
        --card-accent-rgb: var(--inova-grafite-rgb);
    }
    .theme-purple {
        --card-accent: var(--inova-roxo);
        --card-accent-rgb: var(--inova-roxo-rgb);
    }

    /* Card com Glassmorphism e Faixa de Acento Temática */
    .modulo-card {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(226, 232, 240, 0.9);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 1.15rem;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
        position: relative;
        overflow: hidden;
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    /* Faixa de Destaque Superior (Marca do Protótipo) */
    .modulo-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: var(--card-accent);
        transition: height 0.25s ease;
    }

    .modulo-card:hover::before {
        height: 6px;
    }

    .modulo-card:hover {
        transform: translateY(-5px);
        border-color: rgba(var(--card-accent-rgb), 0.35);
        box-shadow: 0 12px 28px rgba(var(--card-accent-rgb), 0.15);
    }

    /* Ícone com Cápsula Colorida */
    .modulo-icon {
        width: 3.85rem;
        height: 3.85rem;
        color: var(--card-accent);
        background: rgba(var(--card-accent-rgb), 0.1);
        border: 1px solid rgba(var(--card-accent-rgb), 0.2);
        border-radius: 1rem;
        transition: transform 0.25s ease, background-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    .modulo-card:hover .modulo-icon {
        transform: scale(1.08);
        background: var(--card-accent);
        color: #ffffff;
        box-shadow: 0 6px 16px rgba(var(--card-accent-rgb), 0.3);
    }

    .modulo-title {
        font-size: 1.05rem;
        font-weight: 700;
        line-height: 1.35;
        min-height: 2.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #1e293b;
    }

    .modulo-description {
        font-size: 0.825rem;
        line-height: 1.45;
        min-height: 2.8rem;
        color: #64748b;
    }

    /* Botão Dinâmico Harmonizado */
    .btn-modulo {
        color: var(--card-accent);
        border: 1.5px solid rgba(var(--card-accent-rgb), 0.6);
        background: rgba(var(--card-accent-rgb), 0.04);
        font-weight: 600;
        font-size: 0.85rem;
        transition: all 0.2s ease;
    }

    .btn-modulo:hover {
        background: var(--card-accent);
        color: #ffffff;
        border-color: var(--card-accent);
        box-shadow: 0 4px 12px rgba(var(--card-accent-rgb), 0.25);
    }
</style>

<div class="argus-home py-4">
    <div class="container-fluid px-4 px-xl-5">

        <!-- Seção de Módulos (Grid 4 colunas em desktop) -->
        <section aria-label="Módulos do Sistema ARGUS">
            <div class="row g-3 g-xl-4 justify-content-center">
                {% for modulo in modulos %}
                <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
                    <article class="modulo-card theme-{{ modulo.cor }} h-100">
                        <div class="card-body p-3 p-xl-4 text-center d-flex flex-column h-100">
                            <!-- Ícone Temático Vibrante -->
                            <div class="modulo-icon d-inline-flex align-items-center justify-content-center mx-auto mb-3">
                                <i class="fas {{ modulo.icone }} fa-lg"></i>
                            </div>

                            <!-- Título do Módulo -->
                            <h2 class="modulo-title mb-2">
                                {{ modulo.nome }}
                            </h2>

                            <!-- Descrição Sintética -->
                            <p class="modulo-description mb-3">
                                {{ modulo.descricao|default:"Acesse este módulo para consultar e gerenciar os recursos do ARGUS." }}
                            </p>

                            <!-- Botão de Acesso Estilizado -->
                            <a href="{% url modulo.url %}" class="btn btn-modulo btn-sm rounded-pill mt-auto py-2 shadow-sm" aria-label="Acessar módulo {{ modulo.nome }}">
                                Acessar módulo <i class="fas fa-arrow-right ms-1 small"></i>
                            </a>
                        </div>
                    </article>
                </div>
                {% endfor %}
            </div>
        </section>

    </div>
</div>
{% endblock %}
