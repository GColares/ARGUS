{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ARGUS | Polo de Inovação IFAM</title>

    <!-- Bootstrap 5.3 & Design System ARGUS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/argus-design-system.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">

    <!-- Tipografia Institucional (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 10% 20%, rgba(var(--bs-success-rgb), 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(var(--bs-primary-rgb), 0.08) 0%, transparent 40%),
                #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(var(--bs-success-rgb), 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 1rem 3rem rgba(var(--bs-dark-rgb), 0.08);
            border-top: 5px solid var(--bs-success);
            border-radius: 1rem;
        }
    </style>
</head>
<body>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">

            <div class="card login-card p-4 p-md-5">
                <header class="text-center mb-4">
                    <img src="{% static 'img/ARGUS1-LOGO-editado.png' %}" alt="Logo ARGUS" height="60" class="mb-3 object-fit-contain">
                    <h1 class="h4 fw-bold text-dark mb-1">Sistema ARGUS</h1>
                    <p class="text-muted small mb-0">Polo de Inovação IFAM</p>
                </header>
                {% if form.errors %}
                    <div class="alert alert-danger py-2 px-3 text-center small rounded-3" role="alert">
                        <i class="fas fa-exclamation-circle me-1"></i> Usuário ou senha incorretos. Tente novamente.
                    </div>
                {% endif %}
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label text-muted fw-bold text-uppercase small">Usuário / SIAPE</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-user"></i></span>
                            <input type="text" name="username" id="id_username" class="form-control border-start-0" required autofocus autocomplete="username" placeholder="Digite seu usuário">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label text-muted fw-bold text-uppercase small">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-lock"></i></span>
                            <input type="password" name="password" id="id_password" class="form-control border-start-0" required autocomplete="current-password" placeholder="••••••••">
                        </div>
                    </div>

                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-success fw-bold py-2 shadow-sm">
                            <i class="fas fa-sign-in-alt me-2"></i> Acessar Sistema
                        </button>
                    </div>
                </form>

                <footer class="text-center mt-4 pt-3 border-top">
                    <small class="text-muted d-block">Acesso restrito a servidores e pesquisadores autorizados.</small>
                </footer>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
